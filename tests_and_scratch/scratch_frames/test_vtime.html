<!DOCTYPE html>
<html><head><style>
#box {
  width: 100px; height: 100px; background: red;
  opacity: 0;
  transition: opacity 2s linear;
}
body.active #box { opacity: 1; }
</style></head>
<body><div id='box'></div>
<script>
setTimeout(function(){ document.body.classList.add('active'); }, 10);
</script>
</body></html>
